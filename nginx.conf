# MoeZ · Nginx 站点配置
# 参照 emlog Pro 2.6.36 的 nginx.conf 补齐。此前整包只有 .htaccess，
# 而 Nginx 不读取 .htaccess —— 伪静态、上传目录禁执行、静态缓存都必须写在这里。
#
# 用法：宝塔「站点 → 设置 → 配置文件」替换 server{} 内容，
#       或放到 /etc/nginx/conf.d/moezzz.conf 后 nginx -t && nginx -s reload。
# 必改项：
#   server_name / root                 换成你的域名与站点目录
#   fastcgi_pass                      宝塔常见 unix:/tmp/php-cgi-74.sock；自建常见 127.0.0.1:9000
#   client_max_body_size               与后台「设置 → 上传设置 → upload_max_mb」对齐，并同步 php.ini

server {
    listen 80;
    server_name moezzz.com www.moezzz.com;
    root /www/wwwroot/moezzz.com;
    index index.php index.html;

    client_max_body_size 64m;
    client_body_timeout 120s;

    # 安全响应头（Apache 环境由根 .htaccess 提供）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # 敏感文件与内部目录禁止 Web 直接访问（PHP 内部 require 不受影响）
    location ~ ^/(config\.php|config\.sample\.php|install\.lock|\.htaccess|\.user\.ini|docker-compose\.yml|auto_install\.json|nginx\.conf|Caddyfile|_ping_tmp\.php|diag\.php|selfcheck\.php)$ {
        deny all;
        access_log off;
    }
    # 2.2.30：授权档案 / 订单数据 / 诊断工具只由 PHP 服务端读写，一并无 Web 入口。
    # 注意不要 deny /update/ —— update-feed.php 的下载链接指向 /update/{包名}.zip。
    location ~ ^/(cache|includes|tests|docs|tools|content/backups|content/archive|content/updates|content/recharge)/ {
        deny all;
        access_log off;
    }
    # 存量附件改名工具仅允许命令行运行，Web 侧再挡一层
    location = /tools/strip-upload-timestamps.php {
        deny all;
        access_log off;
    }

    # 上传目录禁止执行任何脚本 —— 等价于 uploads/.htaccess，Nginx 下必须显式声明。
    # 必须排在通用 \.php$ 之前：Nginx 正则 location 按配置顺序取第一个匹配。
    location ~ ^/uploads/.*\.(php|php3|php4|php5|php7|phtml|cgi|pl|py|sh)$ {
        deny all;
        access_log off;
    }

    # 静态资源缺失直接 404，不回源 PHP；带 ?v= 版本号的主题资源可放心长缓存
    location ~* \.(ico|png|jpe?g|gif|webp|avif|svg|css|js|woff2?|ttf|eot|map|mp4|webm|mp3)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 伪静态：与 .htaccess「不存在的文件统一交给 index.php」一致
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
